[package]
name = "basler-camera-test"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
slint = "=1.18.1"
ort = "=2.0.0-rc.15"
rfd = { version = "=0.17.2", default-features = false, features = ["common-controls-v6"] }
image = { version = "=0.25.10", default-features = false, features = ["bmp", "png", "jpeg"] }

[build-dependencies]
slint-build = "=1.18.1"

# Keep fast rebuilds for dependencies while optimizing the app's image loops
# during ordinary `cargo run` development sessions.
[profile.dev.package.basler-camera-test]
opt-level = 2
